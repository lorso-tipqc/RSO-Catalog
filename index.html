<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>RSO Catalog — Student Life Fair 2026</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<style>
:root{
  --gold:#F4C400;
  --navy:#172033;
  --warm:#FAF9F6;
  --soft:#E9EBF0;
  --light-gold:#FFF3C4;
  --white:#FFFFFF;
  --ink:#172033;
  --muted:#667085;
  --line:#D9DEE7;
  --shadow:0 12px 30px rgba(23,32,51,.12);
  --shadow-soft:0 5px 18px rgba(23,32,51,.09);
}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--warm);color:var(--ink);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}
body{display:flex;flex-direction:column}
button{font:inherit}

.header{
  height:86px;min-height:86px;position:relative;display:flex;align-items:center;
  padding:10px 20px;gap:18px;background:var(--white);color:var(--ink);
  border-bottom:1px solid #E3E5EA;box-shadow:0 2px 12px rgba(23,32,51,.06);z-index:20;
}
.header::after{content:"";position:absolute;left:0;right:0;bottom:0;height:3px;background:var(--gold)}
.brand{display:flex;align-items:center;gap:12px;min-width:292px;height:100%}
.logo-tip-wrap{height:56px;width:116px;background:var(--white);border:1px solid #D8DCE4;border-radius:7px;display:flex;align-items:center;justify-content:center;overflow:hidden;box-shadow:0 2px 6px rgba(23,32,51,.05)}
.logo-tip{height:52px;width:auto;max-width:112px;object-fit:contain}
.logo-lorso-wrap{height:56px;width:84px;background:var(--white);border:1px solid #D8DCE4;border-radius:7px;display:flex;align-items:center;justify-content:center;overflow:hidden;padding:4px;box-shadow:0 2px 6px rgba(23,32,51,.05)}
.logo-lorso{height:48px;width:48px;object-fit:contain}
.divider{height:38px;width:1px;background:#C9CED8;margin:0 2px}
.title{flex:1;text-align:center;min-width:0;padding:0 12px}
.title .eyebrow{font-size:10px;line-height:1.2;letter-spacing:3.2px;color:#B28C00;font-weight:800;margin-bottom:2px}
.title h1{font-family:Georgia,"Times New Roman",serif;font-size:27px;line-height:1.08;margin:0;font-weight:700;color:var(--navy);letter-spacing:.1px}
.title p{margin:4px 0 0;color:#6B7280;font-size:11px;line-height:1.2}
.tools{display:flex;gap:8px;min-width:142px;justify-content:flex-end}
.btn{width:42px;height:42px;border:1px solid #D6DAE2;border-radius:12px;background:var(--white);color:var(--navy);cursor:pointer;font-size:20px;display:grid;place-items:center;transition:background .18s ease,border-color .18s ease,color .18s ease,box-shadow .18s ease,transform .18s ease}
.btn:hover{border-color:var(--gold);background:var(--light-gold);color:var(--navy);box-shadow:0 4px 10px rgba(23,32,51,.08);transform:translateY(-1px)}
.btn:focus-visible,.ctrl:focus-visible,.arrow:focus-visible,.thumb:focus-visible{outline:3px solid rgba(244,196,0,.45);outline-offset:2px}

.layout{display:flex;flex:1;min-height:0;background:var(--soft)}
.sidebar{width:204px;min-width:204px;border-right:1px solid #263149;background:var(--navy);padding:18px 13px 16px;overflow:auto;box-shadow:4px 0 18px rgba(23,32,51,.08);z-index:5}
.sidebar h3{font-size:11px;letter-spacing:2.4px;color:var(--gold);margin:2px 9px 15px;font-weight:800}
.thumbs{display:flex;flex-direction:column;gap:10px;padding-bottom:12px}
.thumb{background:#202A3D;border:1px solid #344057;border-radius:9px;padding:5px;cursor:pointer;transition:border-color .18s ease,box-shadow .18s ease,transform .18s ease,background .18s ease}
.thumb:hover{border-color:#E8C83A;background:#263249;transform:translateY(-1px)}
.thumb.active{border-color:var(--gold);box-shadow:0 0 0 2px rgba(244,196,0,.18),0 5px 14px rgba(0,0,0,.18);background:#263249}
.thumb canvas{display:block;width:100%;height:auto;background:var(--white);border-radius:5px}

.main{position:relative;flex:1;min-width:0;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:hidden;background:var(--warm)}
.main::before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 50% 18%,rgba(255,255,255,.9),rgba(250,249,246,0) 48%);pointer-events:none}
.stage{position:relative;display:flex;align-items:center;justify-content:center;width:min(86vw,1180px);height:calc(100% - 112px);min-height:250px;perspective:1800px;z-index:1}
.page-wrap{position:relative;max-width:92%;max-height:100%;background:var(--white);box-shadow:0 18px 42px rgba(23,32,51,.17),0 3px 9px rgba(23,32,51,.08);border:1px solid #E1E3E8;border-radius:4px;overflow:hidden;transform-origin:left center;transition:transform .38s ease,opacity .25s ease}
.page-wrap.turn-next{transform:rotateY(-8deg)}
.page-wrap.turn-prev{transform:rotateY(8deg)}
#pageCanvas{display:block;max-width:100%;max-height:calc(100vh - 205px);width:auto;height:auto;background:var(--white)}
#links{position:absolute;inset:0;pointer-events:none}
.pdf-link{position:absolute;pointer-events:auto;background:rgba(244,196,0,.025);cursor:pointer;border-radius:2px;transition:background .16s ease,box-shadow .16s ease}
.pdf-link:hover{background:rgba(244,196,0,.14);box-shadow:inset 0 0 0 1px rgba(244,196,0,.55)}
.arrow{position:absolute;top:50%;transform:translateY(-50%);width:50px;height:50px;border-radius:14px;border:1px solid #D5D9E1;background:rgba(255,255,255,.96);color:var(--navy);font-size:30px;line-height:1;z-index:8;cursor:pointer;display:grid;place-items:center;box-shadow:var(--shadow-soft);transition:background .18s ease,border-color .18s ease,color .18s ease,transform .18s ease}
.arrow:hover{border-color:var(--gold);background:var(--light-gold);color:var(--navy);transform:translateY(-50%) scale(1.03)}
.prev{left:8px}.next{right:8px}

.controls{height:76px;min-height:76px;display:flex;align-items:center;justify-content:center;gap:7px;z-index:4}
.controlbar{display:flex;align-items:center;gap:3px;border:1px solid #D8DCE4;background:rgba(255,255,255,.98);border-radius:15px;padding:7px 9px;box-shadow:0 8px 24px rgba(23,32,51,.12)}
.ctrl{border:0;background:transparent;color:var(--navy);font-size:20px;width:37px;height:38px;border-radius:9px;cursor:pointer;display:grid;place-items:center;transition:background .16s ease,color .16s ease}
.ctrl:hover{background:var(--light-gold);color:var(--navy)}
.pagebox{min-width:86px;text-align:center;font-size:12px;font-weight:700;color:var(--navy);padding:0 5px}
.status{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);text-align:center;z-index:5}
#loading{display:block;color:var(--navy);background:rgba(255,255,255,.96);border:1px solid #DCE0E7;border-radius:14px;padding:15px 20px;box-shadow:var(--shadow-soft);font-size:13px;font-weight:600}
#err{display:none;color:var(--navy);max-width:430px;line-height:1.55;background:var(--white);border:1px solid #D9DEE7;border-top:4px solid var(--gold);border-radius:14px;padding:22px 24px;box-shadow:var(--shadow);font-size:15px;font-weight:700}
#err small{display:block;margin-top:8px;color:#667085;font-size:12px;font-weight:500}

@media(max-width:900px){
 .header{height:78px;min-height:78px;padding:8px 13px;gap:10px}
 .brand{min-width:240px;gap:8px}
 .logo-tip-wrap{height:50px;width:102px}.logo-tip{height:47px;max-width:98px}
 .logo-lorso-wrap{height:50px;width:72px}.logo-lorso{height:43px;width:43px}
 .title h1{font-size:23px}.title .eyebrow{font-size:9px;letter-spacing:2.5px}.title p{font-size:10px}
 .tools{min-width:124px}.btn{width:38px;height:38px}
 .sidebar{width:176px;min-width:176px}
 .stage{width:96vw;height:calc(100% - 105px)}
 #pageCanvas{max-height:calc(100vh - 190px)}
}

@media(max-width:700px){
 .header{height:72px;min-height:72px;padding:6px 9px;gap:7px}
 .brand{min-width:0;gap:5px;flex-shrink:0}
 .logo-tip-wrap{height:43px;width:72px;border-radius:6px}.logo-tip{height:40px;max-width:68px}
 .logo-lorso-wrap{height:43px;width:55px;border-radius:6px;padding:2px}.logo-lorso{height:36px;width:36px}
 .divider{height:28px;margin:0 1px}
 .title{padding:0 4px;text-align:center}
 .title .eyebrow{display:block;font-size:7px;letter-spacing:1.65px;margin-bottom:2px;white-space:nowrap}
 .title h1{font-size:16px;white-space:nowrap}
 .title p{font-size:7px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:185px;margin-top:3px}
 .tools{min-width:auto;gap:5px}
 .tools .btn{width:34px;height:34px;border-radius:10px;font-size:17px}
 .sidebar{display:none}
 .layout{background:var(--warm)}
 .stage{width:100%;height:calc(100% - 88px);min-height:200px}
 .page-wrap{max-width:93%;box-shadow:0 12px 30px rgba(23,32,51,.16),0 2px 7px rgba(23,32,51,.08)}
 #pageCanvas{max-width:100%;max-height:calc(100vh - 153px)}
 .arrow{width:40px;height:40px;border-radius:12px;font-size:23px;background:rgba(255,255,255,.97)}
 .prev{left:5px}.next{right:5px}
 .controls{height:66px;min-height:66px}
 .controlbar{padding:5px 6px;border-radius:13px;gap:1px}
 .ctrl{width:30px;height:34px;font-size:18px}
 .pagebox{min-width:62px;font-size:11px}
 #loading{font-size:12px;padding:12px 15px}
 #err{width:min(88vw,380px);padding:18px 19px;font-size:14px}
}

@media(max-width:390px){
 .logo-tip-wrap{width:63px}.logo-tip{max-width:59px;height:38px}
 .logo-lorso-wrap{width:48px}.logo-lorso{width:32px;height:32px}
 .divider{display:none}
 .title .eyebrow{font-size:6px;letter-spacing:1.3px}
 .title h1{font-size:14px}.title p{font-size:6.5px;max-width:145px}
 .tools .btn{width:31px;height:31px}
}
</style>
</head>

  <div class="title">
    <div class="eyebrow">LEAGUE OF RECOGNIZED STUDENT ORGANIZATIONS</div>
    <h1>Student Life Fair 2026</h1>
    <p>PIXARVERSE · Technological Institute of the Philippines — Quezon City</p>
  </div>
  <div class="tools">
    <button class="btn" id="zoomOut" title="Zoom out">−</button>
    <button class="btn" id="zoomIn" title="Zoom in">+</button>
    <button class="btn" id="fullscreen" title="Fullscreen">⛶</button>
  </div>
</header>

<div class="layout">
  <aside class="sidebar">
    <h3>PAGES</h3>
    <div id="thumbs" class="thumbs"></div>
  </aside>

  <main class="main">
    <div id="stage" class="stage">
      <button class="arrow prev" id="prev" aria-label="Previous page">‹</button>
      <div id="pageWrap" class="page-wrap">
        <canvas id="pageCanvas"></canvas>
        <div id="links"></div>
      </div>
      <button class="arrow next" id="next" aria-label="Next page">›</button>
      <div id="loading" class="status">Loading catalog…</div>
      <div id="err" class="status"></div>
    </div>
    <div class="controls">
      <div class="controlbar">
        <button class="ctrl" id="first">«</button>
        <button class="ctrl" id="p">‹</button>
        <div class="pagebox"><span id="pageNo">1</span> / <span id="total">—</span></div>
        <button class="ctrl" id="n">›</button>
        <button class="ctrl" id="last">»</button>
        <button class="ctrl" id="minus">−</button>
        <button class="ctrl" id="plus">+</button>
      </div>
    </div>
  </main>
</div>

<script>
pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

const PDF_FILE='SLF-RSO-Catalog.pdf';
let pdf=null,current=1,scale=1,renderTask=null;

const canvas=document.getElementById('pageCanvas');
const ctx=canvas.getContext('2d',{alpha:false});
const wrap=document.getElementById('pageWrap');
const links=document.getElementById('links');
const loading=document.getElementById('loading');
const err=document.getElementById('err');
const thumbs=document.getElementById('thumbs');

function fitScale(page){
  const vp=page.getViewport({scale:1});
  const stage=document.getElementById('stage');
  const maxW=Math.max(180,stage.clientWidth-40);
  const maxH=Math.max(180,stage.clientHeight-10);
  return Math.min(maxW/vp.width,maxH/vp.height)*scale;
}

async function renderPage(num,animate=true){
  if(!pdf)return;
  if(num<1)num=1;if(num>pdf.numPages)num=pdf.numPages;
  const previous=current;
  current=num;
  if(renderTask){try{renderTask.cancel()}catch(e){}}
  if(animate){
    wrap.classList.remove('turn-next','turn-prev');
    void wrap.offsetWidth;
    wrap.classList.add(num>previous?'turn-next':'turn-prev');
  }
  const page=await pdf.getPage(num);
  const s=fitScale(page);
  const dpr=Math.min(window.devicePixelRatio||1,2);
  const vp=page.getViewport({scale:s});
  canvas.width=Math.floor(vp.width*dpr);
  canvas.height=Math.floor(vp.height*dpr);
  canvas.style.width=vp.width+'px';
  canvas.style.height=vp.height+'px';
  ctx.setTransform(dpr,0,0,dpr,0,0);
  renderTask=page.render({canvasContext:ctx,viewport:vp});
  await renderTask.promise;
  renderLinks(page,vp);
  document.getElementById('pageNo').textContent=current;
  updateThumbs();
}

async function renderLinks(page,vp){
  links.innerHTML='';
  const anns=await page.getAnnotations({intent:'display'});
  for(const a of anns){
    if(a.subtype!=='Link'||!a.rect)continue;
    const [x1,y1,x2,y2]=a.rect;
    const div=document.createElement('a');
    div.className='pdf-link';
    div.style.left=(x1*vp.scale)+'px';
    div.style.top=((page.view[3]-y2)*vp.scale)+'px';
    div.style.width=((x2-x1)*vp.scale)+'px';
    div.style.height=((y2-y1)*vp.scale)+'px';
    if(a.url){
      div.href=a.url;div.target='_blank';div.rel='noopener noreferrer';
    }else if(a.dest){
      div.href='#';
      div.onclick=async e=>{e.preventDefault();try{
        const dest=await pdf.getDestination(a.dest);
        if(dest){const ref=dest[0];for(let i=1;i<=pdf.numPages;i++){const pg=await pdf.getPage(i);const refs=pg.ref; if(refs&&ref.num===refs.num&&ref.gen===refs.gen){renderPage(i);break;}}}
      }catch(_){}}; 
    }else continue;
    links.appendChild(div);
  }
}

function updateThumbs(){
  [...thumbs.children].forEach((x,i)=>x.classList.toggle('active',i+1===current));
}
async function makeThumbs(){
  thumbs.innerHTML='';
  for(let i=1;i<=pdf.numPages;i++){
    const holder=document.createElement('div');holder.className='thumb';
    const c=document.createElement('canvas');holder.appendChild(c);
    holder.onclick=()=>renderPage(i);
    thumbs.appendChild(holder);
    pdf.getPage(i).then(page=>{
      const vp=page.getViewport({scale:0.18});
      c.width=vp.width;c.height=vp.height;
      page.render({canvasContext:c.getContext('2d'),viewport:vp});
    });
  }
}

function go(delta){renderPage(current+delta)}
document.getElementById('prev').onclick=()=>go(-1);
document.getElementById('next').onclick=()=>go(1);
document.getElementById('p').onclick=()=>go(-1);
document.getElementById('n').onclick=()=>go(1);
document.getElementById('first').onclick=()=>renderPage(1);
document.getElementById('last').onclick=()=>renderPage(pdf.numPages);
document.getElementById('plus').onclick=()=>{scale=Math.min(scale+0.15,2.5);renderPage(current,false)};
document.getElementById('minus').onclick=()=>{scale=Math.max(scale-0.15,0.65);renderPage(current,false)};
document.getElementById('zoomIn').onclick=()=>document.getElementById('plus').click();
document.getElementById('zoomOut').onclick=()=>document.getElementById('minus').click();
document.getElementById('fullscreen').onclick=()=>document.documentElement.requestFullscreen?.();

document.addEventListener('keydown',e=>{
 if(e.key==='ArrowRight'||e.key==='PageDown')go(1);
 if(e.key==='ArrowLeft'||e.key==='PageUp')go(-1);
 if(e.key==='Home')renderPage(1);
 if(e.key==='End')renderPage(pdf.numPages);
});

let sx=0;
document.getElementById('stage').addEventListener('touchstart',e=>{sx=e.changedTouches[0].screenX},{passive:true});
document.getElementById('stage').addEventListener('touchend',e=>{
 const dx=e.changedTouches[0].screenX-sx;
 if(Math.abs(dx)>45)go(dx<0?1:-1);
},{passive:true});

window.addEventListener('resize',()=>{if(pdf)renderPage(current,false)});

(async()=>{
 try{
   pdf=await pdfjsLib.getDocument(PDF_FILE).promise;
   document.getElementById('total').textContent=pdf.numPages;
   loading.style.display='none';
   await makeThumbs();
   await renderPage(1,false);
 }catch(e){
   loading.style.display='none';
   err.style.display='block';
   err.innerHTML='Catalog could not be loaded.<br><small>Make sure <b>SLF-RSO-Catalog.pdf</b> is in the same root folder as this index.html.</small>';
   console.error(e);
 }
})();
</script>
